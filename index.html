<!DOCTYPE html><html lang=fa dir=rtl><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>درس اول – بخش ۱: نقطه، خط و دایره</title><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;800&display=swap" rel=stylesheet><style>
:root{--bg:#f4f9f8;--ink:#102a33;--card:#fff;--ln:#cfe3e0;--c1:#1d4ed8;--c2:#db2777;--c3:#d97706;--c4:#7c3aed;--c5:#15803d}
@media(prefers-color-scheme:dark){:root{--bg:#0b1519;--ink:#e4f2f0;--card:#142228;--ln:#223942;--c1:#60a5fa;--c2:#f472b6;--c3:#fbbf24;--c4:#a78bfa;--c5:#4ade80}}
*{box-sizing:border-box}body{margin:0;font-family:Vazirmatn,Tahoma,sans-serif;background:var(--bg);color:var(--ink);line-height:2.1;padding:env(safe-area-inset-top) 0 150px}
header{background:var(--c1);color:#fff;padding:8px 14px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:700;font-size:.95rem}
#bar{height:4px;background:var(--c2);width:0;transition:width .5s}
#fig{position:sticky;top:0;background:var(--bg);z-index:5;padding:6px;border-bottom:1px solid var(--ln)}
svg{width:100%;max-height:36vh;display:block;direction:ltr}
text{font:700 13px Vazirmatn,sans-serif;fill:currentColor}
.p{opacity:0;transition:opacity .6s}.p.on{opacity:1}
.p :is(line,circle,path){stroke-dasharray:1.02 2;stroke-dashoffset:1.02;transition:stroke-dashoffset 1.1s}
.p.on :is(line,circle,path){stroke-dashoffset:0}
.p.hl :is(line,circle,path){stroke-width:5;filter:drop-shadow(0 0 5px currentColor)}
main{max-width:760px;margin:0 auto;padding:8px 14px}
.ln,.bx,.lab,.qz{margin:10px 0}
.bx{background:var(--card);border-right:6px solid var(--c1);border-radius:10px;padding:8px 14px;font-weight:700}
.lab,.qz{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:10px 14px}
.lab input{width:100%;accent-color:var(--c2)}
i{font-style:normal;font-weight:800;border-bottom:2px solid}
.c1{color:var(--c1)}.c2{color:var(--c2)}.c3{color:var(--c3)}.c4{color:var(--c4)}.c5{color:var(--c5)}
.m{direction:ltr;unicode-bidi:isolate;display:inline-block;font-weight:700}
.o{display:block;width:100%;margin:6px 0;padding:6px;font:inherit;border:2px solid var(--c1);border-radius:10px;background:transparent;color:var(--ink);cursor:pointer}
.o.ok{background:var(--c5);color:#fff;border-color:var(--c5)}.o.no{border-color:var(--c2);color:var(--c2)}
#nx{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:9;font:inherit;font-weight:800;padding:8px 28px;border:0;border-radius:24px;background:var(--c2);color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.3)}
#nx:disabled{opacity:.4}
@media(prefers-reduced-motion:reduce){.p,.p *{transition:none!important}}
#mn{font:inherit;color:#fff;background:rgba(255,255,255,.25);border:0;border-radius:8px;padding:0 10px}.bx{line-height:2.2;font-weight:600}</style></head><body><header><span>درس اول – بخش ۱: نقطه، خط و دایره</span><span>طراح: زینب صفری</span><button id=mn>☰ فهرست</button></header><div id=bar></div><div id=fig></div><main id=txt></main><button id=nx></button><script>
const $=s=>document.querySelector(s),sl=m=>new Promise(r=>setTimeout(r,m));
const P=(id,c,h)=>`<g class=p id=p_${id} style="color:var(--c${c})">${h}</g>`;
const pt=(a,r=70)=>[150+r*Math.cos(a*Math.PI/180),100-r*Math.sin(a*Math.PI/180)].map(x=>+x.toFixed(1));
const ln=(a,b,w=2.5)=>`<line x1=${a[0]} y1=${a[1]} x2=${b[0]} y2=${b[1]} stroke=currentColor stroke-width=${w} />`;
const dot=(p,t,dx=7,dy=-7)=>`<circle cx=${p[0]} cy=${p[1]} r=4 fill=currentColor /><text x=${p[0]+dx} y=${p[1]+dy}>${t}</text>`;
const arc=(a,b,big)=>`<path d="M${a} A70 70 0 ${big} 0 ${b}" fill=none stroke=currentColor stroke-width=3 />`;
const n=(a,b)=>{const d=[a[0]-b[0],a[1]-b[1]],l=Math.hypot(...d);return[d[0]/l,d[1]/l]};
const angAt=(V,Pp,Q,r,t)=>{const u=n(Pp,V),w=n(Q,V),a=[V[0]+r*u[0],V[1]+r*u[1]],b=[V[0]+r*w[0],V[1]+r*w[1]],s=u[0]*w[1]-u[1]*w[0]>0?1:0,m=[u[0]+w[0],u[1]+w[1]],l=Math.hypot(...m)||1;return `<path d="M${a} A${r} ${r} 0 0 ${s} ${b}" fill=none stroke=currentColor stroke-width=2.5 /><text x=${V[0]+(r+14)*m[0]/l-8} y=${V[1]+(r+14)*m[1]/l+4}>${t}</text>`};
const X=(p,q,r,s)=>{const d=(p[0]-q[0])*(r[1]-s[1])-(p[1]-q[1])*(r[0]-s[0]),a=p[0]*q[1]-p[1]*q[0],b=r[0]*s[1]-r[1]*s[0];return[(a*(r[0]-s[0])-(p[0]-q[0])*b)/d,(a*(r[1]-s[1])-(p[1]-q[1])*b)/d].map(x=>+x.toFixed(1))};
const OO=[150,100];
const C=P('circ',1,'<circle cx=150 cy=100 r=70 fill=none stroke=currentColor stroke-width=2.5 />');
const O=P('O',1,'<circle cx=150 cy=100 r=3.5 fill=currentColor /><text x=132 y=92>O</text>');
const svg=h=>`<svg viewBox="0 0 300 240">${h}</svg>`;

const L={next:null,figs:{
a:v=>{const p=[150-v*.8,100+v*.6],st=v<70?5:v==70?3:4,A=[135,70],Cc=[250,45],B=pt(-30);return svg(C+O+P('rad',2,ln(OO,B)+'<text x=176 y=108>r</text>')+P('pB',3,dot(B,'B',8,16))+P('pA',5,dot(A,'A',-4,-8))+P('pC',4,dot(Cc,'C',8,-6))+P('P',st,ln(OO,p,1.5)+dot(p,'P',-18,12)))},
b:v=>{const y=100+v,w=v<70?Math.sqrt(4900-v*v):0,A=[210,y];return svg(C+O+P('d',3,ln([20,y],[280,y],3.5)+`<text x=262 y=${y-8}>d</text>`)+P('OH',2,ln(OO,[150,y])+`<path d="M150,${y-10} L160,${y-10} L160,${y}" fill=none stroke=currentColor stroke-width=2 />`+(v==70?'':dot([150,y],'H',8,16)))+P('A',4,ln(OO,A,1.5)+dot(A,'A'))+P('X',5,v<70?dot([150-w,y],'')+dot([150+w,y],''):v==70?dot([150,y],'F',8,16):''))},
c:v=>svg(C+O+P('d1',2,ln([255,40],[255,150],3)+'<text x=262 y=48>d1</text>')+P('d2',5,ln([120,15],[120,185],3)+'<text x=126 y=22>d2</text>')+P('d3',3,ln([140,170],[260,170],3)+'<text x=248 y=160>d3</text>')+P('F',3,dot([150,170],'F',8,18))+P('X2',5,dot([120,36.8],'')+dot([120,163.2],''))),
e:v=>{const B=[150+v,170];return svg(P('d',3,ln([20,170],[280,170],3.5)+'<text x=262 y=160>d</text>')+P('pA',1,dot([150,40],'A',8,0))+P('AH',2,ln([150,40],[150,170])+dot([150,170],'H',-14,18)+'<path d="M150,160 L160,160 L160,170" fill=none stroke=currentColor stroke-width=2 />')+P('B',4,ln([150,40],B)+dot(B,'B',6,18)))},
d:v=>{const t=v*Math.PI/180,c=Math.cos(t),s=Math.sin(t),F=pt(v),ro=[-c,s],q=[s,c],f=(a,b)=>[+(F[0]+a*ro[0]+b*q[0]).toFixed(1),+(F[1]+a*ro[1]+b*q[1]).toFixed(1)];return svg(C+O+P('rOF',2,ln(OO,F)+dot(F,'F',8,-6))+P('tan',3,ln(f(0,-75),f(0,75),3.5))+P('sq',2,`<path d="M${f(12,0)} L${f(12,12)} L${f(0,12)}" fill=none stroke=currentColor stroke-width=2 />`))}},
steps:[
{p:'وضعیت نقطه و دایره'},
{f:'a',v:30,t:'دایره یکی از شکل‌های مهم هندسه است. همهٔ نقاط روی دایره از <i class=c1 s=O+circ>مرکز O</i> فاصلهٔ ثابتی دارند؛ این فاصله <i class=c2 s=rad>شعاع r</i> است. دایره‌ای به مرکز O و شعاع r را <span class=m>C(O, r)</span> می‌نویسیم.'},
{t:'سه نقطه را با شعاع می‌سنجیم: <i class=c3 s=pB>B</i> روی دایره، <i class=c5 s=pA>A</i> درون دایره و <i class=c4 s=pC>C</i> بیرون دایره.'},
{on:'pB',q:{q:'الف) اگر نقطهٔ B روی دایره C(O, r) باشد، فاصلهٔ آن تا مرکز ......... شعاع است.',o:['برابر','کمتر از','بیشتر از'],a:0,h:'نقطه روی دایره یعنی فاصله‌اش از مرکز همان شعاع است.',e:'درست است: OB = r.'}},
{on:'pC',q:{q:'ب) اگر نقطهٔ C بیرون دایره باشد، فاصلهٔ آن تا مرکز ......... شعاع است.',o:['برابر','کمتر از','بیشتر از'],a:2,h:'نقطهٔ بیرونی از دایره دورتر است.',e:'درست است: OC > r.'}},
{on:'pA',q:{q:'پ) اگر نقطهٔ A درون دایره باشد، فاصلهٔ آن تا مرکز ......... شعاع است.',o:['برابر','کمتر از','بیشتر از'],a:1,h:'نقطهٔ درونی به مرکز نزدیک‌تر از شعاع است.',e:'درست است: OA < r.'}},
{on:'P',lab:{t:'🎮 نقطهٔ P را حرکت بده. دقیقاً در چه فاصله‌ای از «درون» به «بیرون» می‌رود؟',min:0,max:130,v:30,o:v=>`<span class=m>OP = ${v} ، r = 70</span> ← ${v<70?'درون دایره':v==70?'<b>روی دایره</b>':'بیرون دایره'}`}},
{d:'جمع‌بندی: <span class=m>OP &lt; r</span> درون دایره، <span class=m>OP = r</span> روی دایره و <span class=m>OP &gt; r</span> بیرون دایره.'},
{p:'فعالیت‌های خط و دایره'},
{f:'c',on:'circ+O',t:'یک خط و یک دایره یا هیچ نقطهٔ مشترک ندارند، یا یک یا دو نقطهٔ مشترک. <i class=c2 s=d1>خط d1</i> هیچ نقطهٔ مشترکی با دایره ندارد.'},
{t:'اگر خط و دایره فقط یک نقطهٔ مشترک داشته باشند، <i class=c3 s=d3+F>خط بر دایره مماس است</i> و آن نقطه، نقطهٔ تماس نام دارد.'},
{t:'اگر دو نقطهٔ مشترک داشته باشند، <i class=c5 s=d2+X2>خط و دایره متقاطع‌اند</i> و آن خط را نسبت به دایره <b>قاطع</b> می‌نامیم.'},
{q:{q:'خطی که دایره را در دو نقطه قطع می‌کند، نسبت به دایره چه نام دارد؟',o:['قاطع','مماس','نامتقاطع'],a:0,h:'مماس فقط یک نقطهٔ مشترک دارد.',e:'درست است: قاطع.'}},
{f:'e',v:60,t:'یادآوری: خط <i class=c3 s=d>d</i> و نقطهٔ <i class=c1 s=pA>A</i> را که روی آن نیست در نظر بگیر. اگر <i class=c2 s=AH>H پای عمودی باشد که از A بر d رسم می‌شود</i>، طول AH فاصلهٔ A از خط d است. هر نقطهٔ دیگر خط، مثل <i class=c4 s=B>B</i>، دورتر است: <span class=m>AB &gt; AH</span>.'},
{lab:{t:'🎮 نقطهٔ B را روی خط حرکت بده. آیا AB هرگز از AH کوچک‌تر می‌شود؟',min:5,max:110,v:60,o:v=>`<span class=m>AH = 130 ، AB = ${Math.hypot(130,v).toFixed(1)}</span>`}},
{q:{q:'فاصلهٔ یک نقطه تا یک خط یعنی چه؟',o:['طول عمود از نقطه بر خط','طول هر پاره‌خط دلخواه از نقطه به خط','طول پاره‌خط مورب'],a:0,h:'کوتاه‌ترین پاره‌خط بین نقطه و خط را بیاب.',e:'عمود، کوتاه‌ترین است و فاصله را نشان می‌دهد.'}},
{f:'b',v:40,on:'circ+O',t:'خط <i class=c3 s=d>d</i> را در نظر بگیر. از مرکز O بر آن <i class=c2 s=OH>عمود OH</i> را رسم می‌کنیم (H پای عمود است). طول OH فاصلهٔ مرکز از خط است و آن را با شعاع مقایسه می‌کنیم. طبق یادآوری، <i class=c4 s=A>هر نقطهٔ دیگر خط</i> از O دورتر از H است.'},
{on:'X',q:{q:'الف) اگر OH < r باشد، خط و دایره ......... نقطهٔ اشتراک دارند؛ یعنی متقاطع‌اند.',o:['دو','یک','هیچ'],a:0,h:'H درون دایره است و از دو طرف آن به دایره می‌رسیم.',e:'درست است: خط قاطع است.'}},
{v:70,on:'X',q:{q:'ب) اگر OH = r باشد، خط و دایره ......... نقطهٔ اشتراک دارند؛ یعنی خط ......... است.',o:['یک — مماس','دو — قاطع','هیچ — بیرونی'],a:0,h:'در این حالت H روی دایره است.',e:'درست است: فقط H روی دایره است و خط مماس است.'}},
{v:100,q:{q:'پ) اگر OH > r باشد، خط و دایره ......... دارند.',o:['هیچ نقطهٔ اشتراکی','یک نقطهٔ اشتراک','دو نقطهٔ اشتراک'],a:0,h:'H بیرون دایره است و بقیهٔ نقاط خط از H دورترند.',e:'درست است: همهٔ نقاط خط بیرون دایره‌اند.'}},
{v:70,t:'چرا در حالت <span class=m>OH = r</span> فقط H روی دایره است؟ چون <i class=c4 s=A>هر نقطهٔ دیگر خط</i> از O دورتر از H است، یعنی <span class=m>OA &gt; r</span> و بیرون دایره می‌افتد.'},
{lab:{t:'🎮 فاصلهٔ خط را تغییر بده و تعداد نقاط مشترک را بشمار.',min:10,max:130,v:100,o:v=>`<span class=m>OH = ${v} ، r = 70</span> ← ${v<70?'قاطع: دو نقطهٔ مشترک':v==70?'<b>مماس: یک نقطهٔ مشترک</b>':'بدون نقطهٔ مشترک'}`}},
{v:70,on:'d+X',q:{q:'فعالیت ۱ (الف): خط d در F بر دایره مماس است. نزدیک‌ترین نقطهٔ d به مرکز O کدام است؟',o:['نقطهٔ تماس F','نقطه‌ای دورتر از F','هیچ‌کدام'],a:0,h:'بقیهٔ نقاط مماس بیرون دایره‌اند، پس از O دورتر از r هستند.',e:'F روی دایره است (فاصله r) و بقیه نقاط خط بیرون دایره‌اند؛ پس F نزدیک‌ترین است.'}},
{on:'OH',q:{q:'(ب) از O بر d عمود کن. این عمود، خط d را در کدام نقطه قطع می‌کند؟',o:['در F','در نقطه‌ای غیر از F'],a:0,h:'پای عمود نزدیک‌ترین نقطه به O است.',e:'پای عمود نزدیک‌ترین نقطه است و آن F بود؛ پس عمود در F می‌افتد.'}},
{q:{q:'(پ) نتیجه: اگر F نقطه‌ای روی دایره باشد، شعاع OF و خط مماس در F ......... .',o:['بر هم عمودند','با هم موازی‌اند','هم‌اندازه‌اند'],a:0,h:'به پاسخ قسمت (ب) نگاه کن.',e:'درست است: OF ⟂ d.'}},
{t:'فعالیت ۲: برعکس، فرض کن <i class=c2 s=OH>OF بر d عمود است</i>. هر نقطهٔ دیگر خط مثل <i class=c4 s=A>A</i> را بگیر. در مثلث قائم‌الزاویهٔ OFA، OA وتر است، پس <span class=m>OA &gt; OF = r</span> و A بیرون دایره است.'},
{q:{q:'در مثلث قائم‌الزاویهٔ OFA (قائمه در F) کدام ضلع از همه بلندتر است؟',o:['OA','OF','FA'],a:0,h:'ضلع روبه‌رو به زاویهٔ قائمه را بیاب.',e:'وتر OA بلندترین ضلع است.'}},
{t:'پس همهٔ نقاط d جز <i class=c5 s=X>F</i> بیرون دایره‌اند. d فقط یک نقطهٔ مشترک با دایره دارد، یعنی بر دایره مماس است.'},
{f:'d',v:40,on:'circ+O',t:'فعالیت ۳: نقطهٔ F روی دایره است. مماس در F را چگونه رسم کنیم؟ اول <i class=c2 s=rOF>شعاع OF</i> را رسم می‌کنیم، بعد در F <i class=c3 s=tan+sq>خطی عمود بر OF</i> می‌کشیم.'},
{lab:{t:'🎮 F را روی دایره بچرخان؛ مماس هر بار عمود بر شعاع می‌ماند.',min:0,max:359,v:40,o:v=>'<span class=m>زاویهٔ بین مماس و شعاع = 90°</span> در همهٔ موقعیت‌ها'}},
{p:'قضیهٔ مماس و اثبات'},
{f:'b',v:70,on:'circ+O',d:'قضیه: خط d در نقطهٔ F بر دایرهٔ C(O, r) مماس است ⟺ d در F بر شعاع OF عمود است.'},
{t:'قضیه «اگر و تنها اگر» است؛ پس دو طرف را جدا ثابت می‌کنیم: (الف) مماس ⟸ عمود، (ب) عمود ⟸ مماس.'},
{v:70,t:'<b>(الف) فرض:</b> خط <i class=c3 s=d>d</i> در <i class=c5 s=X>F</i> بر دایره مماس است. <b>حکم:</b> OF بر d عمود است.'},
{v:40,t:'<b>اثبات:</b> از O عمود <i class=c2 s=OH>OH</i> را بر d رسم می‌کنیم. اگر <span class=m>OH &lt; r</span> بود، d با دایره <i class=c5 s=X>دو نقطهٔ مشترک</i> داشت و قاطع می‌شد؛ این با مماس بودن d تناقض دارد.'},
{v:100,t:'اگر <span class=m>OH &gt; r</span> بود، <i class=c3 s=d>d هیچ نقطهٔ مشترکی</i> با دایره نداشت؛ اما F روی d و روی دایره است. این هم تناقض است.'},
{v:70,t:'پس <span class=m>OH = r</span> است. آنگاه <i class=c5 s=X>H روی دایره</i> است و چون مماس فقط یک نقطهٔ مشترک دارد، H = F. بنابراین <i class=c2 s=OH>OF همان عمود OH است</i> و <span class=m>OF ⟂ d</span>. ∎'},
{f:'b',v:70,on:'circ+O+d+X',t:'<b>(ب) فرض:</b> خط d در نقطهٔ F از دایره، <i class=c2 s=OH>بر شعاع OF عمود</i> است. <b>حکم:</b> d بر دایره مماس است.'},
{t:'<b>اثبات:</b> نقطهٔ دلخواه <i class=c4 s=A>A</i> را روی d، غیر از F، می‌گیریم. مثلث OFA در F قائمه است و OA وتر آن است؛ پس <span class=m>OA &gt; OF = r</span>.'},
{t:'یعنی هر نقطهٔ d جز F بیرون دایره است. پس d فقط در <i class=c5 s=X>F</i> با دایره مشترک است و بر دایره مماس است. ∎'},
{box:'<b>برگهٔ اثبات برای امتحان</b><br><b>قضیه:</b> خط d در نقطهٔ F بر C(O, r) مماس است ⟺ OF ⟂ d.<br><b>(⟹) فرض:</b> d در F مماس است. <b>حکم:</b> OF ⟂ d.<br><b>اثبات:</b> از O عمود OH را بر d رسم می‌کنیم. اگر <span class=m>OH &lt; r</span>، d دو نقطهٔ مشترک دارد (تناقض). اگر <span class=m>OH &gt; r</span>، d نقطهٔ مشترکی ندارد در حالی که F مشترک است (تناقض). پس <span class=m>OH = r</span> و H روی دایره است؛ چون تنها نقطهٔ مشترک F است، H = F و OF ⟂ d. ∎<br><b>(⟸) فرض:</b> OF ⟂ d در F. <b>حکم:</b> d مماس است.<br><b>اثبات:</b> A نقطهٔ دلخواه از d، غیر از F. در مثلث قائم‌الزاویهٔ OFA وتر OA است، پس <span class=m>OA &gt; OF = r</span> و A بیرون دایره است. پس F تنها نقطهٔ مشترک است و d مماس است. ∎'},
{q:{q:'فاصلهٔ مرکز دایره‌ای به شعاع 4 از خط d برابر 5 است. وضعیت d چیست؟',o:['بیرون دایره، بدون نقطهٔ مشترک','مماس','قاطع'],a:0,h:'5 را با 4 مقایسه کن.',e:'چون OH > r، خط بیرون دایره است.'}},
{q:{q:'اگر OH = 3 و r = 5 باشد، خط و دایره چند نقطهٔ مشترک دارند؟',o:['0','1','2'],a:2,h:'3 را با 5 مقایسه کن.',e:'OH < r، پس خط قاطع است و دو نقطهٔ مشترک دارد.'}},
{q:{q:'خطی در نقطهٔ F از دایره بر شعاع OF عمود است. این خط نسبت به دایره چیست؟',o:['مماس','قاطع','بیرونی'],a:0,h:'به قضیهٔ مماس نگاه کن.',e:'طبق قضیه، مماس است.'}}
]};
let V=0,FK='a',on=new Set,quick=0,tk=0;const nx=$('#nx'),T=$('#txt');
function draw(){$('#fig').innerHTML=L.figs[FK](V);document.querySelectorAll('#fig .p :is(line,circle,path)').forEach(e=>e.setAttribute('pathLength',1));on.forEach(i=>{const e=$('#p_'+i);e&&e.classList.add('on')})}
function clr(){document.querySelectorAll('.hl').forEach(e=>e.classList.remove('hl'))}
function show(ids,h=1){clr();void document.body.offsetHeight;ids.forEach(i=>{on.add(i);const e=$('#p_'+i);if(e){e.classList.add('on');if(h)e.classList.add('hl')}})}
const fit=e=>{const r=e.getBoundingClientRect(),m=innerHeight-110;if(r.bottom>m)scrollBy(0,r.bottom-m)};
async function type(el,html,t0){let acc='';for(const p of html.split(/(<[^>]+>|&\w+;)/)){if(!p)continue;if(p[0]=='<'||p[0]=='&'){acc+=p;const m=p.match(/\ss="?([^">\s]+)/);if(m)show(m[1].split('+'));continue}for(const ch of p){if(t0!=tk)return;acc+=ch;el.innerHTML=acc;fit(el);if(!quick){await sl(55);if('.؛،:'.includes(ch))await sl(220)}}}el.innerHTML=html}
const wait=(l,en=1)=>new Promise(r=>{nx.textContent=l;nx.disabled=!en;nx.onclick=r;window.unlock=()=>nx.disabled=false});
const go=d=>{T.append(d);fit(d)};
const PT=[];L.steps.forEach(s=>s.p?PT.push({n:s.p,s:[]}):PT[PT.length-1].s.push(s));
function menu(){tk++;T.innerHTML='';$('#fig').innerHTML='';$('#bar').style.width='0';nx.style.display='none';const h=document.createElement('div');h.className='ln';h.innerHTML='<b>یکی از بخش‌ها را انتخاب کن:</b>';T.append(h);PT.forEach((p,i)=>{const b=document.createElement('button');b.className='o';b.textContent=(i+1)+'. '+p.n;b.onclick=()=>part(i);T.append(b)});scrollTo(0,0)}
async function part(i){const t=++tk,S=PT[i].s;T.innerHTML='';on=new Set;FK='a';V=0;draw();nx.style.display='';scrollTo(0,0);
for(let k=0;k<S.length;k++){const s=S[k];$('#bar').style.width=k/S.length*100+'%';
if(s.f){FK=s.f;on=new Set}if(s.v!=null)V=s.v;if(s.f||s.v!=null)draw();if(s.on)show(s.on.split('+'),0);
const d=document.createElement('div');
if(s.t||s.d){d.className=s.d?'bx':'ln';go(d);nx.textContent='⚡ سریع';nx.disabled=false;quick=0;nx.onclick=()=>quick=1;await type(d,s.t||s.d,t);if(t!=tk)return;clr();await wait('ادامه ◀')}
else if(s.box){d.className='bx';d.innerHTML=s.box;go(d);await wait('ادامه ◀')}
else if(s.lab){const b=s.lab;V=b.v;draw();d.className='lab';d.innerHTML=`<b>${b.t}</b><input type=range min=${b.min} max=${b.max} value=${b.v} step=1><div class=out>${b.o(V)}</div>`;go(d);d.querySelector('input').oninput=e=>{V=+e.target.value;draw();d.querySelector('.out').innerHTML=b.o(V);unlock()};await wait('ادامه ◀',0)}
else if(s.q){const q=s.q;d.className='qz';d.innerHTML=`<b>${q.q}</b>`;const fb=document.createElement('div');q.o.forEach((x,j)=>{const b=document.createElement('button');b.className='o';b.textContent=x;b.onclick=()=>{if(j==q.a){b.classList.add('ok');fb.textContent='🎉 '+q.e;fit(d);d.querySelectorAll('.o').forEach(y=>y.disabled=true);unlock()}else{b.classList.add('no');fb.textContent='🤔 '+q.h;fit(d)}};d.append(b)});d.append(fb);go(d);await wait('ادامه ◀',0)}
if(t!=tk)return}
$('#bar').style.width='100%';const re=document.createElement('button');re.className='o';re.textContent='🔁 مرور دوبارهٔ همین بخش';re.onclick=()=>part(i);T.append(re);fit(re);
await wait(i<PT.length-1?'بخش بعد ◀':'فهرست ◀');if(t!=tk)return;i<PT.length-1?part(i+1):menu()}
$('#mn').onclick=menu;menu();
</script></body></html>
